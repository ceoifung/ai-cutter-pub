name: Build Windows Release

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（如 v0.1.0）'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 解析版本
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          fi
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "构建版本: $TAG"

      - name: 拉取私有仓库源码
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_PULL_TOKEN }}
        run: |
          git clone --depth 1 --branch "$TAG" \
            "https://x-access-token:${TOKEN}@github.com/ceoifung/ai-cutter-2.git" app
          cd app && git log --oneline -1

      - name: 安装 Python 依赖
        shell: bash
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps kokoro-onnx==0.6.1

      - name: 下载模型资源（本仓库 Release）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: app
        run: |
          mkdir -p models bin
          gh release download models-v1 --repo ceoifung/ai-cutter-pub \
            --pattern "kokoro-v1.0.onnx" --pattern "voices-v1.0.bin" \
            --pattern "lama_fp32.onnx" --dir models --clobber
          ls -la models/

      - name: 下载 FFmpeg
        shell: bash
        working-directory: app
        run: |
          curl -sS -L -o ff.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          unzip -q ff.zip
          cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe bin/
          cp ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe bin/
          rm -rf ffmpeg-master-latest-win64-gpl ff.zip

      - name: 打包 exe
        shell: bash
        working-directory: app
        run: python tools/build_exe.py

      - name: 冒烟测试（worker 模式自检）
        shell: bash
        working-directory: app/dist/AI-Cutter
        run: ./AI-Cutter.exe --diag || true

      - name: 打 zip
        shell: bash
        working-directory: app/dist
        run: |
          7z a -tzip "AI-Cutter-${{ env.VERSION }}-win64.zip" AI-Cutter
          ls -la *.zip

      - name: 创建 Release 并上传
        shell: bash
        working-directory: app/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --repo ceoifung/ai-cutter-pub \
            --title "AI-Cutter $TAG" \
            --notes "自动构建。更新说明：
          - 版本 ${{ env.VERSION }}
          - 下载 AI-Cutter-${{ env.VERSION }}-win64.zip 解压即用
          - 首次使用：AI 设置里配接口；模型已内置" \
            --target main \
            "AI-Cutter-${{ env.VERSION }}-win64.zip"
